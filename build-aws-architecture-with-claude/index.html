<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the Architect</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#0d1b2a; --navy-2:#15263b; --line:#263b54; --orange:#ff9900; --teal:#57c9bd; --ink:#e8eef5; --muted:#9fb0c3; --arw:#5c789a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Montserrat,system-ui,sans-serif; background:var(--navy); color:var(--ink); line-height:1.55; }
    .wrap { max-width:1040px; margin:0 auto; padding:48px 24px 80px; }
    header h1 { font-size:2.2rem; font-weight:700; margin:0 0 6px; }
    header h1 span { color:var(--orange); }
    header p { color:var(--muted); margin:0 0 28px; font-size:1.05rem; }
    label { display:block; font-weight:600; margin:0 0 8px; }
    textarea { width:100%; min-height:120px; padding:14px 16px; border-radius:10px; border:1px solid #2a3d55; background:var(--navy-2); color:var(--ink); font-family:inherit; font-size:1.05rem; resize:vertical; }
    textarea:focus { outline:2px solid var(--orange); border-color:transparent; }
    button { margin-top:14px; padding:13px 26px; border:0; border-radius:10px; background:var(--orange); color:#1a1200; font-weight:700; font-size:1.05rem; font-family:inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    .spinner { color:var(--muted); margin-top:20px; }
    .design { margin-top:30px; }
    .design h2 { margin:0 0 4px; font-size:1.5rem; }
    .design .summary { margin:0 0 4px; font-size:1.02rem; }
    .design .for { color:var(--muted); font-size:.9rem; margin:0 0 6px; }
    .section-label { margin:26px 0 14px; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; font-weight:700; }

    /* Flow pipeline */
    .flow { display:flex; align-items:flex-start; overflow-x:auto; padding:6px 2px 14px; }
    .col { display:flex; flex-direction:column; align-items:center; }
    .node { width:152px; border-radius:14px; padding:15px 12px 14px; text-align:center; background:linear-gradient(180deg,#1b2d42 0%,#132131 100%); border:1px solid var(--line); box-shadow:0 8px 20px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.03); }
    .node.main { min-height:120px; display:flex; flex-direction:column; justify-content:center; }
    .node.branch { width:140px; background:linear-gradient(180deg,#152331 0%,#0f1a27 100%); border:1px dashed #33506e; box-shadow:0 5px 14px rgba(0,0,0,.28); }
    .badge { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; background:rgba(255,153,0,.16); border:1px solid rgba(255,153,0,.38); }
    .node.branch .badge { background:rgba(87,201,189,.16); border:1px solid rgba(87,201,189,.40); margin-bottom:8px; width:38px; height:38px; }
    .badge svg { width:23px; height:23px; color:var(--orange); }
    .node.branch .badge svg { width:20px; height:20px; color:var(--teal); }
    .ncat { font-size:.6rem; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:#b7c4d3; }
    .nsvc { font-weight:700; font-size:.88rem; margin-top:4px; line-height:1.26; }
    .arrow-h { color:var(--arw); align-self:flex-start; height:120px; display:flex; align-items:center; padding:0 2px; flex:0 0 auto; }
    .arrow-v { color:var(--arw); display:flex; justify-content:center; margin:3px 0; }

    /* Detail + pillars grids */
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .comp { background:var(--navy-2); border:1px solid var(--line); border-left:3px solid var(--orange); border-radius:10px; padding:14px 16px; }
    .comp .cat { color:var(--orange); font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .comp .svc { font-weight:700; margin:5px 0 6px; font-size:1.02rem; }
    .comp .rsn { color:var(--muted); font-size:.9rem; line-height:1.45; }
    .pill { background:var(--navy-2); border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:10px; padding:12px 15px; }
    .pill .pillar { color:var(--teal); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .pill .note { color:var(--muted); font-size:.88rem; margin-top:4px; }
    .warn { color:#ffcf87; font-size:.9rem; margin-top:14px; }
    .raw { white-space:pre-wrap; background:var(--navy-2); border:1px solid var(--line); border-radius:10px; padding:16px; font-size:.9rem; }
    .history h3 { margin:44px 0 12px; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; }
    .hist-item { border-top:1px solid var(--line); padding:14px 0; }
    .hist-item .q { font-weight:600; }
    .hist-item .a { color:var(--muted); font-size:.9rem; margin-top:3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Ask the <span>Architect</span></h1>
      <p>Describe the system you need. Claude designs the AWS architecture - running on AWS itself.</p>
    </header>
    <label for="scenario">Your scenario</label>
    <textarea id="scenario" placeholder="e.g. An online shop that gets a huge spike every Black Friday and can't fall over. Global customers, product catalogue and order history."></textarea>
    <button id="ask">Design it</button>
    <div id="spinner" class="spinner" style="display:none;">Designing...</div>
    <div id="result"></div>
    <div class="history"><h3>Recent designs</h3><div id="history"></div></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    const ICONS = {
      users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.6a3 3 0 0 1 0 5.3"/><path d="M17.5 14.2c2.1.5 3.5 2.3 3.5 4.8"/>',
      frontend:'<rect x="3" y="4" width="18" height="12" rx="1.6"/><path d="M9 20h6M12 16v4"/>',
      network:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.5 2.4 2.5 14.6 0 17M12 3.5c-2.5 2.4-2.5 14.6 0 17"/>',
      compute:'<rect x="6" y="6" width="12" height="12" rx="1.6"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
      database:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
      storage:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.7l8 4.3 8-4.3M12 12v9"/>',
      security:'<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/>',
      auth:'<circle cx="8" cy="8.5" r="3.6"/><path d="M10.6 11.1L20 20.5M16.5 17l2-2M18.5 19l2-2"/>',
      integration:'<path d="M9 3v4.5M15 3v4.5M7 7.5h10v2.5a5 5 0 0 1-10 0V7.5zM12 15v6"/>',
      monitoring:'<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-3.5"/><circle cx="12" cy="16" r="1.1"/>',
      def:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.2"/>'
    };
    function iconFor(name, catOf) {
      if (/^users?$/i.test(name)) return ICONS.users;
      const cat = ((catOf && catOf[name]) || "").toLowerCase();
      if (cat.includes("compute")) return ICONS.compute;
      if (cat.includes("data")) return ICONS.database;
      if (cat.includes("network")) return ICONS.network;
      if (cat.includes("secur")) return ICONS.security;
      if (cat.includes("storage")) return ICONS.storage;
      if (cat.includes("front")) return ICONS.frontend;
      if (cat.includes("auth")) return ICONS.auth;
      if (cat.includes("integ")) return ICONS.integration;
      if (cat.includes("monitor")) return ICONS.monitoring;
      return ICONS.def;
    }
    const svgWrap = (paths) => '<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg></span>';
    const arrowH = '<div class="arrow-h"><svg viewBox="0 0 34 16" width="34" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="8" x2="25" y2="8"/><polyline points="20,3 26,8 20,13"/></svg></div>';
    const arrowV = '<div class="arrow-v"><svg viewBox="0 0 16 26" width="16" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="1" x2="8" y2="18" stroke-dasharray="3 3"/><polyline points="3,13 8,19 13,13"/></svg></div>';

    function renderFlow(flow, components) {
      const main = (flow && flow.main) || [];
      if (!main.length) return "";
      const branches = (flow && flow.branches) || [];
      const catOf = {}; (components || []).forEach(c => { if (c && c.service) catOf[c.service] = c.category; });
      const byFrom = {}; branches.forEach(b => { if (b && b.from) (byFrom[b.from] = byFrom[b.from] || []).push(b); });
      let html = '<div class="flow">';
      main.forEach((svc, i) => {
        if (i > 0) html += arrowH;
        const cat = catOf[svc];
        html += '<div class="col"><div class="node main">' + svgWrap(iconFor(svc, catOf)) +
                (cat ? '<div class="ncat">' + esc(cat) + '</div>' : '') +
                '<div class="nsvc">' + esc(svc) + '</div></div>';
        (byFrom[svc] || []).forEach(b => {
          const bn = b.to || b.service || "";
          html += arrowV + '<div class="node branch">' + svgWrap(iconFor(bn, catOf)) +
                  (b.label ? '<div class="ncat">' + esc(b.label) + '</div>' : '') +
                  '<div class="nsvc">' + esc(bn) + '</div></div>';
        });
        html += '</div>';
      });
      return html + '</div>';
    }

    function renderDesign(scenario, design, warning) {
      const comps = (design.components || []).map(c =>
        `<div class="comp"><div class="cat">${esc(c.category)}</div><div class="svc">${esc(c.service)}</div><div class="rsn">${esc(c.reason)}</div></div>`).join("");
      const pillars = (design.well_architected || []).map(w =>
        `<div class="pill"><div class="pillar">${esc(w.pillar)}</div><div class="note">${esc(w.note)}</div></div>`).join("");
      const flow = renderFlow(design.flow, design.components);
      return `<div class="design">
        <h2>${esc(design.title || "Suggested architecture")}</h2>
        ${design.summary ? `<p class="summary">${esc(design.summary)}</p>` : ""}
        <p class="for">For: ${esc(scenario)}</p>
        ${flow ? `<div class="section-label">Request flow</div>${flow}` : ""}
        ${comps ? `<div class="section-label">Services</div><div class="grid">${comps}</div>` : ""}
        ${pillars ? `<div class="section-label">Well-Architected</div><div class="grid">${pillars}</div>` : ""}
        ${design.raw ? `<div class="raw">${esc(design.raw)}</div>` : ""}
        ${warning ? `<div class="warn">! ${esc(warning)}</div>` : ""}
      </div>`;
    }

    async function ask() {
      const scenario = $("scenario").value.trim();
      if (!scenario) return;
      $("ask").disabled = true; $("spinner").style.display = "block"; $("result").innerHTML = "";
      try {
        const res = await fetch("/api/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ scenario }) });
        const data = await res.json();
        if (data.error) { $("result").innerHTML = `<div class="raw">${esc(data.error)}</div>`; }
        else { $("result").innerHTML = renderDesign(scenario, data.design || {}, data.warning); loadHistory(); }
      } catch (e) { $("result").innerHTML = `<div class="raw">${esc(String(e))}</div>`; }
      finally { $("ask").disabled = false; $("spinner").style.display = "none"; }
    }
    async function loadHistory() {
      try {
        const res = await fetch("/api/history"); const rows = await res.json();
        if (!Array.isArray(rows)) return;
        $("history").innerHTML = rows.map(r => {
          const d = r.design || {}; const n = (d.components || []).length;
          return `<div class="hist-item"><div class="q">${esc(r.scenario)}</div><div class="a">${esc(d.title || "")}${n ? ` — ${n} services` : ""}</div></div>`;
        }).join("");
      } catch (e) {}
    }
    $("ask").addEventListener("click", ask);
    loadHistory();
  </script>
</body>
</html>
