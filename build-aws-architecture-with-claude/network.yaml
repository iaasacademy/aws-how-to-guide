AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Ask the Architect - network foundation (SAA-C03 grade, DynamoDB edition).
  A /16 VPC across two Availability Zones with TWO tiers: public and private-app.
  There is no database tier - DynamoDB is a managed service reached over a gateway
  endpoint, not something that lives in a subnet. One zonal NAT gateway, route
  tables, two security groups (ALB, app), and gateway endpoints for S3 and DynamoDB.

Parameters:
  ProjectName:
    Type: String
    Default: ata
    Description: Short prefix used in resource names and tags.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

Resources:

  # ---------------------------------------------------------------- VPC + IGW
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-igw' }]

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ------------------------------------------------------------- Public subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-1' }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-2' }]

  # ---------------------------------------------------------- Private app subnets
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.10.0/24
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-1' }]

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-2' }]

  # --------------------------------------------------- NAT gateway (zonal, public 1)
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nat-eip' }]

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-nat' }]

  # ------------------------------------------------------ Public route table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-rt' }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet1 }

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet2 }

  # ------------------------------------------------ Private app route table (via NAT)
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-rt' }]

  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  AppSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref AppRouteTable, SubnetId: !Ref AppSubnet1 }

  AppSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref AppRouteTable, SubnetId: !Ref AppSubnet2 }

  # ------------------------------------------- Gateway endpoints (free, private path)
  # DynamoDB and S3 are reached privately from the app subnets - no NAT, no internet.
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTable]

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTable]

  # --------------------------------------------------------- Security groups
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow HTTP/HTTPS from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-alb-sg' }]

  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App - allow app port from the ALB only
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-app-sg' }]

  AppSgIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSg
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSg
      Description: App port from ALB

# ------------------------------------------------------------------ Outputs
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub '${ProjectName}-VpcId' }
  PublicSubnet1:
    Value: !Ref PublicSubnet1
    Export: { Name: !Sub '${ProjectName}-PublicSubnet1' }
  PublicSubnet2:
    Value: !Ref PublicSubnet2
    Export: { Name: !Sub '${ProjectName}-PublicSubnet2' }
  AppSubnet1:
    Value: !Ref AppSubnet1
    Export: { Name: !Sub '${ProjectName}-AppSubnet1' }
  AppSubnet2:
    Value: !Ref AppSubnet2
    Export: { Name: !Sub '${ProjectName}-AppSubnet2' }
  AlbSgId:
    Value: !Ref AlbSg
    Export: { Name: !Sub '${ProjectName}-AlbSgId' }
  AppSgId:
    Value: !Ref AppSg
    Export: { Name: !Sub '${ProjectName}-AppSgId' }
